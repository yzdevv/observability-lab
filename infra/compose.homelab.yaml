# Server overrides: run every lab container inside homelab-lab.slice (CPU/RAM cap for the
# whole lab), and keep Postgres data outside the nightly backup set. See docs/RESOURCE-BUDGET.md.
# The lab-web service (public + homelab networks) is added in Milestone E.
x-slice: &slice
  cgroup_parent: homelab-lab.slice

services:
  postgres:
    <<: *slice
    volumes: !override
      - /opt/homelab/lab-data/observability-lab/postgres:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
  redis: *slice
  gateway: *slice
  order-api-node: *slice
  worker-node: *slice
  order-api-go: *slice
  worker-go: *slice
  otel-collector: *slice
  tempo:
    <<: *slice
    volumes: !override
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - /opt/homelab/lab-data/observability-lab/tempo:/var/tempo
  prometheus:
    <<: *slice
    volumes: !override
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - /opt/homelab/lab-data/observability-lab/prometheus:/prometheus
  loki:
    <<: *slice
    volumes: !override
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - /opt/homelab/lab-data/observability-lab/loki:/loki
  grafana:
    <<: *slice
    volumes: !override
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - /opt/homelab/lab-data/observability-lab/grafana:/var/lib/grafana
