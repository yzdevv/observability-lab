# Base definition. Combine with compose.dev.yaml (Mac) or compose.homelab.yaml (server).
# Limits follow docs/RESOURCE-BUDGET.md.
name: observability-lab

x-service: &service
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cpu_shares: 256          # production containers default to 1024
  pids_limit: 128
  networks: [lab]

x-app: &app
  <<: *service
  read_only: true
  tmpfs: [/tmp]

x-db-env: &db-env
  DATABASE_URL: postgres://lab:${LAB_DB_PASSWORD:-lab-dev-only}@postgres:5432/lab
  REDIS_URL: redis://redis:6379

# Standard OTEL_* variables, read by both the Node and Go SDKs. Each service adds OTEL_SERVICE_NAME.
x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=observability-lab,deployment.environment.name=${LAB_ENV:-dev}
  OTEL_BSP_SCHEDULE_DELAY: "1000"   # export spans every 1 s (default 5 s) so traces show up fast
  OTEL_METRICS_EXPORTER: otlp
  OTEL_METRIC_EXPORT_INTERVAL: "10000"   # push metrics every 10 s
  OTEL_LOGS_EXPORTER: otlp
  # Node: skip the process/host/os detectors; their attributes (full command line etc.) would be
  # copied onto every log line in Loki. Service name, namespace and environment come from env.
  OTEL_NODE_RESOURCE_DETECTORS: env,serviceinstance

x-depends: &depends
  postgres: { condition: service_healthy }
  redis: { condition: service_healthy }

services:
  postgres:
    <<: *service
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${LAB_DB_PASSWORD:-lab-dev-only}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=50
      - -c
      - work_mem=4MB
      - -c
      - log_min_duration_statement=250
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    cpus: 0.75

  redis:
    <<: *app
    image: redis:7.4-alpine
    # Disposable lab data: no persistence. Only TTL'd cache keys may be evicted, never streams.
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "48mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 96m
    cpus: 0.25

  gateway:
    <<: *app
    build: { context: .., dockerfile: infra/node.Dockerfile, args: { APP: gateway } }
    image: observability-lab/gateway:local
    command: ["node", "--import", "@lab/telemetry/register", "src/server.ts"]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: gateway
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      ORDER_NODE_URL: http://order-api-node:8081
      ORDER_GO_URL: http://order-api-go:8082
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-20}
      MAX_INFLIGHT: ${MAX_INFLIGHT:-20}
      MAX_BACKLOG: ${MAX_BACKLOG:-500}
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 128m
    cpus: 0.5

  # --- Node implementation -------------------------------------------------
  order-api-node:
    <<: *app
    build: { context: .., dockerfile: infra/node.Dockerfile, args: { APP: order-node } }
    image: observability-lab/order-node:local
    command: ["node", "--import", "@lab/telemetry/register", "src/api.ts"]
    environment:
      <<: [*db-env, *otel-env]
      OTEL_SERVICE_NAME: order-api-node
      PORT: "8081"
    depends_on: *depends
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 128m
    cpus: 0.5

  worker-node:
    <<: *app
    image: observability-lab/order-node:local
    command: ["node", "--import", "@lab/telemetry/register", "src/worker.ts"]
    environment:
      <<: [*db-env, *otel-env]
      OTEL_SERVICE_NAME: worker-node
    depends_on:
      <<: *depends
      order-api-node: { condition: service_started }   # same image; built by order-api-node
    mem_limit: 128m
    cpus: 0.5

  # --- Go implementation (same limits as Node, for a fair comparison) -----
  order-api-go:
    <<: *app
    build: { context: ../apps/order-go }
    image: observability-lab/order-go:local
    environment:
      <<: [*db-env, *otel-env]
      OTEL_SERVICE_NAME: order-api-go
      MODE: api
      PORT: "8082"
    depends_on: *depends
    healthcheck:
      test: ["CMD", "/order-go", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 128m
    cpus: 0.5

  worker-go:
    <<: *app
    image: observability-lab/order-go:local
    environment:
      <<: [*db-env, *otel-env]
      OTEL_SERVICE_NAME: worker-go
      MODE: worker
    depends_on:
      <<: *depends
      order-api-go: { condition: service_started }   # same image; built by order-api-go
    mem_limit: 128m
    cpus: 0.5

  # --- Telemetry ---------------------------------------------------------
  otel-collector:
    <<: *app
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    environment:
      GOMEMLIMIT: 160MiB
    depends_on: [tempo, prometheus, loki]
    mem_limit: 192m
    cpus: 0.5

  tempo:
    <<: *app
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    environment:
      GOMEMLIMIT: 420MiB
    mem_limit: 512m
    cpus: 0.5

  prometheus:
    <<: *app
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-otlp-receiver
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    environment:
      GOMEMLIMIT: 320MiB
    mem_limit: 384m
    cpus: 0.5

  loki:
    <<: *app
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    environment:
      GOMEMLIMIT: 320MiB
    mem_limit: 384m
    cpus: 0.5

  grafana:
    <<: *app
    image: grafana/grafana:13.2.6
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # No plugin downloads at runtime: the rootfs is read-only, and an auto-update unloads the
      # bundled Prometheus plugin before failing to write the new one.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on: [tempo, prometheus, loki]
    mem_limit: 256m
    cpus: 0.5

networks:
  lab: {}

volumes:
  pgdata: {}
  tempo-data: {}
  prometheus-data: {}
  loki-data: {}
  grafana-data: {}
