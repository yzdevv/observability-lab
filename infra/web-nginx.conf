# lab-web: static page + /api/ proxy to the gateway. The gateway enforces the real limits
# (per-IP order rate, in-flight cap, load and backlog guards); nginx adds a coarse request-rate
# and connection cap in front, so floods are dropped before they reach Node.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;   # traces record every API request; static files need no log
  sendfile on;
  keepalive_timeout 30s;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Behind the Cloudflare tunnel every request comes from cloudflared, so key the limits on the
  # visitor's address from CF-Connecting-IP (set by Cloudflare, which overwrites client values).
  map $http_cf_connecting_ip $client_key {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
  }
  limit_req_zone  $client_key zone=api:5m rate=10r/s;
  limit_conn_zone $client_key zone=conn:5m;
  limit_req_status 429;
  limit_conn_status 429;

  upstream gateway {
    server gateway:8080;
    keepalive 8;
  }

  server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      limit_conn conn 10;
      client_max_body_size 4k;
      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_read_timeout 20s;
    }

    # Hashed file names: cache for a year.
    location /assets/ {
      expires 1y;
    }

    location /recorded/ {
      expires 1h;
    }

    location / {
      try_files $uri /index.html;
      expires -1;
    }
  }
}
