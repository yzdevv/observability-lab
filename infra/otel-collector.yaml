# OpenTelemetry Collector: the only place apps send telemetry to (OTLP/HTTP on the internal network).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Refuse data before the container hits its memory limit (192m).
  memory_limiter:
    check_interval: 1s
    limit_mib: 150
    spike_limit_mib: 40
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
