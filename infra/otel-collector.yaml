# OpenTelemetry Collector: the only place apps send telemetry to (OTLP/HTTP on the internal network).
#   traces  → Tempo, and into the span-metrics and service-graph connectors
#   metrics → Prometheus (OTLP receiver): app/runtime metrics + RED metrics derived from spans
#   logs    → Loki (native OTLP endpoint)
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

connectors:
  # RED metrics (rate, errors, duration) per service and span, generated from every span, so the
  # apps need no hand-written request metrics. Labels are kept low-cardinality: no IDs, no IPs.
  span_metrics:
    histogram:
      unit: ms
      explicit:
        buckets: [2ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 750ms, 1s, 2.5s, 5s]
    dimensions:
      - name: lab.impl
      - name: lab.scenario
      - name: http.response.status_code
      - name: lab.shed_reason
    metrics_flush_interval: 15s
  # Request counts and latency between services (gateway → order API → …), for Grafana's service map.
  service_graph:
    latency_histogram_buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s]
    dimensions: [lab.impl]
    metrics_flush_interval: 15s   # default 60 s is too coarse for 1-minute rates
    store:
      ttl: 5s
      max_items: 2000

processors:
  # Refuse data before the container hits its memory limit (256m).
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
    spike_limit_mib: 50
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo, span_metrics, service_graph]
    metrics:
      receivers: [otlp, span_metrics, service_graph]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
